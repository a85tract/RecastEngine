name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      # The optional backends are installed here on purpose: type-checking
      # recast.transform.numpy without NumPy present checks less, not more.
      - run: uv run --extra dev --extra fortran --extra translate mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python }}
      # The fortran extra is installed here on purpose: the reference frontend
      # is the one plugin that ships in-tree, so its tests must actually run
      # rather than skip for want of fparser.
      - run: uv run --python ${{ matrix.python }} --extra dev --extra fortran --extra translate pytest --cov=recast

  # The whole translate spine against a real compiler: frontend, transform,
  # rwset gate, f2py-golden oracle, differential.bitexact -- ending bit-exact,
  # and failing when the candidate is corrupted on purpose. This is the only
  # job that compiles Fortran, so it alone installs gfortran.
  spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: uv python install 3.11
      - run: uv run --extra dev --extra fortran --extra translate --extra verify pytest tests/test_f2py_oracle.py tests/test_notary_verifier.py -v
      # The public form of the same claim: one command, eight stages, evidence
      # on disk. What the roadmap's P2 "Done when" literally names.
      - run: uv run --extra fortran --extra translate --extra verify recast run translate examples/toy_physics --config examples/toy_physics/recast.json

  # The core must stay importable and usable with zero optional dependencies.
  # If this breaks, a domain package has leaked into the engine.
  bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv run --no-dev python -c "import recast; print(recast.__version__)"
      - run: uv run --no-dev recast doctor
      - run: uv run --no-dev recast recipes
      # The fortran frontend must still *register* without fparser installed;
      # the missing extra is reported when it is asked to parse, not before.
      - run: uv run --no-dev recast plugins | grep -qx "  fortran"
