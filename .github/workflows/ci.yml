name: ci

# Automatic runs are off while the Actions allowance is exhausted. Restore the
# push (main) and pull_request triggers when the quota resets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .

  # The DCO (./DCO) is certified one commit at a time, by a Signed-off-by
  # trailer naming the author. An agreement nothing verifies is not an
  # agreement, so this is its check -- the same script contributors run
  # locally. It reads the range the pull request adds, because sign-off is
  # required from adoption forward and history before that is left alone.
  #
  # Dormant until the pull_request trigger is restored: there is no range to
  # check on a manual dispatch, and inventing one would check the wrong thing.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the range needs both of its ends
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Every commit carries its sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_signoff.py "$BASE..HEAD"

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      # The optional backends are installed here on purpose: type-checking
      # recast.transform.numpy without NumPy present checks less, not more.
      - run: uv run --extra dev --extra fortran --extra translate mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python }}
      # The fortran extra is installed here on purpose: the reference frontend
      # is the one plugin that ships in-tree, so its tests must actually run
      # rather than skip for want of fparser.
      - run: uv run --python ${{ matrix.python }} --extra dev --extra fortran --extra translate pytest --cov=recast

  # The contract, run rather than read. This is the suite an out-of-tree
  # extension has to pass to be an extension and not a fork, so the engine
  # running it against its own plugins is the minimum: a check nobody's plugins
  # pass is indistinguishable from a check that does not work.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      # The oracle case compiles: its cache key asks the compiler its version
      # before deciding anything, and the checks that materialize build a real
      # reference. Without this the whole Oracle kind skips, and a suite that
      # skips the kind whose failure mode is a silently stale reference is not
      # worth the job it runs in.
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: uv python install 3.11
      # Every extra a case needs, because a case whose dependency is missing
      # is skipped by name -- honest, and still not a check that ran. The
      # transforms also have to be *constructible*: determinism is an attribute
      # of an instance, and a factory that cannot run leaves the agentic-gate
      # rule unable to judge anything.
      - run: uv run --extra dev --extra fortran --extra translate --extra verify pytest conformance/ -rs

  # The whole translate spine against a real compiler: frontend, transform,
  # rwset gate, f2py-golden oracle, differential.bitexact -- ending bit-exact,
  # and failing when the candidate is corrupted on purpose. This is the only
  # job that compiles Fortran, so it alone installs gfortran.
  spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: uv python install 3.11
      - run: uv run --extra dev --extra fortran --extra translate --extra verify pytest tests/test_f2py_oracle.py tests/test_notary_verifier.py -v
      # The public form of the same claim: one command, eight stages, evidence
      # on disk. What the roadmap's P2 "Done when" literally names.
      - run: uv run --extra fortran --extra translate --extra verify recast run translate examples/toy_physics --config examples/toy_physics/recast.json --summary examples/toy_physics/verification.json
      # The committed summary is a claim about what the gate concludes. If a
      # run on a clean machine concludes something else, the claim is stale --
      # which is exactly the failure the file exists to make visible.
      - run: git diff --exit-code examples/toy_physics/verification.json

  # The core must stay importable and usable with zero optional dependencies.
  # If this breaks, a domain package has leaked into the engine.
  bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv run --no-dev python -c "import recast; print(recast.__version__)"
      - run: uv run --no-dev recast doctor
      - run: uv run --no-dev recast recipes
      # The fortran frontend must still *register* without fparser installed;
      # the missing extra is reported when it is asked to parse, not before.
      - run: uv run --no-dev recast plugins | grep -qx "  fortran"
