name: hygiene

# The gate that has to hold before this repository can go public, and every day
# after. Migrating 10k lines out of two NCAR-bound private repositories is
# exactly the situation where a site path or an allocation account slips in.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  site-leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: No site-specific paths, accounts, or credentials
        run: python tools/check_hygiene.py .

  secrets:
    runs-on: ubuntu-latest
    env:
      # The action wrapper requires a paid licence for organization accounts.
      # The scanner itself is MIT, so run the binary directly.
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks needs history: a scrubbed HEAD is not enough
      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --redact --no-banner --exit-code 1

  # Findings from the engine's own cyber gate route to Sec-Track, never here.
  # This job only proves the SBOM scanner runs; it must not print finding detail.
  sbom:
    runs-on: ubuntu-latest
    env:
      # anchore/sbom-action wraps syft, but it is fetched from GitHub's action
      # download endpoint, which rate-limits (429/503) and fails the gate on
      # GitHub's infrastructure rather than on anything in this repository. syft
      # is Apache-2.0, so run the binary directly -- the same move already made
      # for gitleaks above.
      SYFT_VERSION: "1.51.0"
    steps:
      - uses: actions/checkout@v5
      - name: Install syft
        run: |
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin syft
          syft version
      - name: Generate CycloneDX SBOM
        run: |
          syft scan dir:. -o cyclonedx-json=recast-engine.cdx.json
          python3 -c "import json; d=json.load(open('recast-engine.cdx.json')); print(len(d.get('components', [])), 'components')"
      - uses: actions/upload-artifact@v4
        with:
          name: recast-engine.cdx.json
          path: recast-engine.cdx.json
