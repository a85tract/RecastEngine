name: hygiene

# The gate that has to hold before this repository can go public, and every day
# after. Migrating 10k lines out of two NCAR-bound private repositories is
# exactly the situation where a site path or an allocation account slips in.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  site-leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: No site-specific paths, accounts, or credentials
        run: python tools/check_hygiene.py .

  secrets:
    runs-on: ubuntu-latest
    env:
      # The action wrapper requires a paid licence for organization accounts.
      # The scanner itself is MIT, so run the binary directly.
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks needs history: a scrubbed HEAD is not enough
      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --redact --no-banner --exit-code 1

  # Findings from the engine's own cyber gate route to Sec-Track, never here.
  # This job only proves the scanners run; it must not print finding detail.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: recast-engine.cdx.json
