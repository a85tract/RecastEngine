name: release

# A published GitHub release of a `v*` tag builds the sdist and wheel from
# that tag and uploads them to PyPI through trusted publishing (OIDC): no
# token lives anywhere. PyPI has to know this repository and this workflow
# as the publisher of `recast-engine` first; until it does, the publish step
# says so and the built files are still attached to the run.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv build
      - run: uv run --with twine --no-project twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only the published repository publishes: PyPI knows it, and no other
    # tree carrying this file is meant to reach PyPI at all.
    if: github.event_name == 'release' && github.repository == 'a85tract/RecastEngine'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
