[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recast-engine"
version = "0.0.1.dev0"
description = "An agentic engine for modernizing legacy scientific software"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yueqi Chen", email = "yueqi.chen@colorado.edu" }]
keywords = ["fortran", "modernization", "hpc", "verification", "llm-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# The core stays importable with no compiler, no GPU, and no model provider.
# Everything that needs one of those is an extra.
dependencies = []

[project.optional-dependencies]
fortran = ["fparser>=0.2"]
translate = ["numpy>=1.26"]
# meson+ninja are f2py's build backend: the f2py-golden oracle shells out
# to them when it compiles the reference.
verify = ["numpy>=1.26", "sympy>=1.12", "mpmath>=1.3", "meson>=1.1", "ninja>=1.11"]
numba = ["numba>=0.59"]
jax = ["jax>=0.4.30"]
agents = ["anthropic>=0.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]
all = ["recast-engine[fortran,translate,verify,numba,jax,agents]"]

[project.scripts]
recast = "recast.cli:main"

[project.urls]
Homepage = "https://github.com/a85tract/RecastEngine"
Ecosystem = "https://github.com/a85tract/SciRecast"

# --- Plugin registration -----------------------------------------------------
# Out-of-tree plugins -- a domain extension, a site executor -- declare the
# same groups in their own pyproject. Nothing else is needed to extend the
# engine.

[project.entry-points."recast.frontends"]
fortran = "recast.fortran.frontend:factory"

[project.entry-points."recast.verifiers"]
# Quoted: an unquoted dotted key would be read as a nested table.
"static.rwset" = "recast.verify.rwset:factory"
"symbolic.notary" = "recast.verify.notary:factory"
"differential.bitexact" = "recast.verify.bitexact:factory"
"differential.tolerance" = "recast.verify.tolerance:factory"

[project.entry-points."recast.oracles"]
f2py-golden = "recast.oracle.f2py:factory"

[project.entry-points."recast.transforms"]
"translate.numpy" = "recast.transform.numpy.translate:factory"
"port.jax" = "recast.transform.jax.translate:factory"

[project.entry-points."recast.executors"]
local = "recast.executors.local:factory"

[project.entry-points."recast.stores"]
fs-evidence = "recast.store.filesystem:FilesystemEvidenceStore"
fs-findings = "recast.store.filesystem:FilesystemFindingStore"

# Not a plugin kind: a declaration of which plugins the conformance suite
# should check, and what material each one's checks need. See conformance/.
[project.entry-points."recast.conformance"]
recast = "recast.conformance.builtin:PLUGIN_SET"

[project.entry-points."recast.recipes"]
translate = "recast.recipes:TranslateRecipe"
refactor = "recast.recipes:RefactorRecipe"
port = "recast.recipes:PortRecipe"
audit = "recast.recipes:AuditRecipe"

[tool.hatch.build.targets.wheel]
packages = ["src/recast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "hpc: needs a batch scheduler; skipped in CI",
    "gpu: needs an accelerator; skipped in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    # N818 wants every exception suffixed "Error". AccessViolation and
    # OracleUnavailable are named to be read at a call site, and the alarming
    # one should read alarming.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
packages = ["recast"]
strict = true
warn_unreachable = true

# fparser2 ships no py.typed marker. It is confined to recast.fortran, and the
# node types it returns are untyped trees anyway -- the frontend's own boundary
# (Unit, Facts) is where the types have to hold.
[[tool.mypy.overrides]]
module = ["fparser.*"]
ignore_missing_imports = true

# Optional accelerators the emitted runtime reaches for only if they are there:
# mpmath for a higher-precision fold, scipy for erf/erfc. Both fall back to a
# pure-Python path, so neither is a dependency of anything.
[[tool.mypy.overrides]]
module = ["mpmath.*", "scipy.*", "sympy.*", "jax.*"]
ignore_missing_imports = true

# The JAX backend is a faithful port: tools/jax_diff.py holds every emitted
# byte to the script it came from across 109 modules, and that check is only
# meaningful while the code is recognisably the same code. Annotating 600
# lines of AST surgery is the next slice, done with that diff green throughout;
# until then the annotation rules are off *here only*, and every other kind of
# type error still fails. Delete this block when the port is typed.
[[tool.mypy.overrides]]
module = ["recast.transform.jax.backend", "recast.transform.jax.runtime"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
