[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recast-engine"
version = "0.0.1.dev0"
description = "An agentic engine for modernizing legacy scientific software"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yueqi Chen", email = "yueqi.chen@colorado.edu" }]
keywords = ["fortran", "modernization", "hpc", "verification", "llm-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# The core stays importable with no compiler, no GPU, and no model provider.
# Everything that needs one of those is an extra.
dependencies = []

[project.optional-dependencies]
fortran = ["fparser>=0.2"]
translate = ["numpy>=1.26"]
# meson+ninja are f2py's build backend: the f2py-golden oracle shells out
# to them when it compiles the reference.
verify = ["numpy>=1.26", "sympy>=1.12", "mpmath>=1.3", "meson>=1.1", "ninja>=1.11"]
numba = ["numba>=0.59"]
jax = ["jax>=0.4.30"]
agents = ["anthropic>=0.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]
all = ["recast-engine[fortran,translate,verify,numba,jax,agents]"]

[project.scripts]
recast = "recast.cli:main"

[project.urls]
Homepage = "https://github.com/a85tract/RecastEngine"
Ecosystem = "https://github.com/a85tract/SciRecast"

# --- Plugin registration -----------------------------------------------------
# Out-of-tree plugins -- a domain extension, a site executor -- declare the
# same groups in their own pyproject. Nothing else is needed to extend the
# engine.

[project.entry-points."recast.frontends"]
fortran = "recast.fortran.frontend:factory"
python-numpy = "recast.python.frontend:factory"

[project.entry-points."recast.verifiers"]
# Quoted: an unquoted dotted key would be read as a nested table.
"static.complete" = "recast.verify.complete:factory"
"static.rwset" = "recast.verify.rwset:factory"
"symbolic.notary" = "recast.verify.notary:factory"
"differential.bitexact" = "recast.verify.bitexact:factory"
"differential.tolerance" = "recast.verify.tolerance:factory"
"differential.python-numba" = "recast.verify.python_accelerators:numba_factory"
"differential.python-jax" = "recast.verify.python_accelerators:jax_factory"

[project.entry-points."recast.oracles"]
f2py-golden = "recast.oracle.f2py:factory"
numpy-anchor = "recast.oracle.numpy_anchor:factory"
dump-replay = "recast.oracle.dump_replay:factory"
python-source = "recast.oracle.python_source:factory"

[project.entry-points."recast.transforms"]
"translate.numpy" = "recast.transform.numpy.translate:factory"
"port.jax" = "recast.transform.jax.translate:factory"
"translate.numba" = "recast.transform.numba.translate:factory"
"translate.cuda" = "recast.transform.cuda.translate:factory"
"translate.python-numba" = "recast.transform.python_accelerators:numba_factory"
"translate.python-jax" = "recast.transform.python_accelerators:jax_factory"

[project.entry-points."recast.scanners"]
secret = "recast.scan.secret:factory"
composition = "recast.scan.composition:factory"

[project.entry-points."recast.executors"]
local = "recast.executors.local:factory"

[project.entry-points."recast.stores"]
fs-evidence = "recast.store.filesystem:FilesystemEvidenceStore"
fs-findings = "recast.store.filesystem:FilesystemFindingStore"

# Not a plugin kind: a declaration of which plugins the conformance suite
# should check, and what material each one's checks need. See conformance/.
[project.entry-points."recast.conformance"]
recast = "recast.conformance.builtin:PLUGIN_SET"

[project.entry-points."recast.recipes"]
translate = "recast.recipes:TranslateRecipe"
refactor = "recast.recipes:RefactorRecipe"
port = "recast.recipes:PortRecipe"
audit = "recast.recipes:AuditRecipe"
python-to-numba = "recast.recipes:PythonToNumbaRecipe"
python-to-jax = "recast.recipes:PythonToJaxRecipe"

[project.entry-points."recast.engines"]
"recast.fortran-python.numpy" = "recast.engines:fortran_numpy_engine"
"recast.python-numpy.numba" = "recast.engines:python_numba_engine"
"recast.python-numpy.jax" = "recast.engines:python_jax_engine"

[tool.hatch.build.targets.wheel]
packages = ["src/recast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "hpc: needs a batch scheduler; skipped in CI",
    "gpu: needs an accelerator; skipped in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# corpus/ is twelve upstream Fortran libraries vendored as submodules, to be
# translated, not styled. A few carry Python of their own; it is theirs.
extend-exclude = ["corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    # N818 wants every exception suffixed "Error". AccessViolation and
    # OracleUnavailable are named to be read at a call site, and the alarming
    # one should read alarming.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
packages = ["recast"]
strict = true
warn_unreachable = true

# fparser2 ships no py.typed marker. It is confined to recast.fortran, and the
# node types it returns are untyped trees anyway -- the frontend's own boundary
# (Unit, Facts) is where the types have to hold.
[[tool.mypy.overrides]]
module = ["fparser.*"]
ignore_missing_imports = true

# Optional accelerators the emitted runtime reaches for only if they are there:
# mpmath for a higher-precision fold, scipy for erf/erfc. Both fall back to a
# pure-Python path, so neither is a dependency of anything.
[[tool.mypy.overrides]]
module = ["mpmath.*", "scipy.*", "sympy.*", "jax.*", "numba.*"]
ignore_missing_imports = true

# The Numba runtime's shims are annotated -- unlike the JAX backend below, this
# one is fourteen functions and there was no reason not to. What is exempt is
# narrower: numba ships no stubs, so ``@njit`` is an untyped decorator and mypy
# calls everything it wraps untyped no matter how the function is written. The
# rule is off for that one module and nothing else; if numba ever ships stubs,
# delete these three lines and nothing will break.
[[tool.mypy.overrides]]
module = ["recast.transform.numba.runtime"]
disallow_untyped_decorators = false

# The JAX backend carries no annotations, and that is a decision rather than a
# postponement. It is a faithful port, and what holds it is tools/jax_diff.py:
# every emitted byte, against the script it came from, across 109 modules. That
# is a stronger check than types, because it compares output rather than
# absence of crashes -- and it is not a thin one. Measured: the diff exercises
# 96% of the module's statements, and the twelve it misses are refusal branches
# ("this construct is not in the subset, hand it back"), which construct nothing
# and are the last place a type would have helped.
#
# The reason to revisit is not tidiness, it is the day the diff stops
# protecting -- and the condition here was originally written for a way of
# working that is not the one in use. It said: widening the emitter's subset
# makes this code stop matching the script, so annotate before starting that
# work. But the backend is developed in its author's repository and reaches
# this one as a relay. A widened jaxize.py is merged across, both sides move
# together, and the diff stays green. It does not retire on that day; it is
# what checks that day's merge landed faithfully.
#
# So the real condition is divergence, whoever causes it: the first change to
# recast/transform/jax/ that is not a faithful re-port of the script. That is
# when the diff goes red for a reason other than a defect, when it has to be
# retired rather than fixed, and when nothing is watching this code any more.
# Annotate before merging *that* change, while the diff is still green enough
# to catch the annotation pass itself -- AST surgery fails by emitting subtly
# wrong code rather than by crashing.
#
# Only the annotation rules are off, and only here. Every other kind of type
# error in these modules still fails the build.
[[tool.mypy.overrides]]
module = ["recast.transform.jax.backend", "recast.transform.jax.runtime"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
