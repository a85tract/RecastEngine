[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recast-engine"
version = "0.0.1.dev0"
description = "An agentic engine for modernizing legacy scientific software"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yueqi Chen", email = "yueqi.chen@colorado.edu" }]
keywords = ["fortran", "modernization", "hpc", "verification", "llm-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# The core stays importable with no compiler, no GPU, and no model provider.
# Everything that needs one of those is an extra.
dependencies = []

[project.optional-dependencies]
fortran = ["fparser>=0.2"]
verify = ["numpy>=1.26", "sympy>=1.12", "mpmath>=1.3"]
numba = ["numba>=0.59"]
jax = ["jax>=0.4.30"]
agents = ["anthropic>=0.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]
all = ["recast-engine[fortran,verify,numba,jax,agents]"]

[project.scripts]
recast = "recast.cli:main"

[project.urls]
Homepage = "https://github.com/a85tract/RecastEngine"
Ecosystem = "https://github.com/a85tract/SciRecast"

# --- Plugin registration -----------------------------------------------------
# Out-of-tree plugins (for example recast-cesm) declare the same groups in
# their own pyproject. Nothing else is needed to extend the engine.

[project.entry-points."recast.frontends"]
fortran = "recast.fortran.frontend:factory"

[project.entry-points."recast.executors"]
local = "recast.executors.local:factory"

[project.entry-points."recast.stores"]
fs-evidence = "recast.store.filesystem:FilesystemEvidenceStore"
fs-findings = "recast.store.filesystem:FilesystemFindingStore"

[project.entry-points."recast.recipes"]
translate = "recast.recipes:TranslateRecipe"
refactor = "recast.recipes:RefactorRecipe"
port = "recast.recipes:PortRecipe"
audit = "recast.recipes:AuditRecipe"

[tool.hatch.build.targets.wheel]
packages = ["src/recast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "hpc: needs a batch scheduler; skipped in CI",
    "gpu: needs an accelerator; skipped in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    # N818 wants every exception suffixed "Error". AccessViolation and
    # OracleUnavailable are named to be read at a call site, and the alarming
    # one should read alarming.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
packages = ["recast"]
strict = true
warn_unreachable = true

# fparser2 ships no py.typed marker. It is confined to recast.fortran, and the
# node types it returns are untyped trees anyway -- the frontend's own boundary
# (Unit, Facts) is where the types have to hold.
[[tool.mypy.overrides]]
module = ["fparser.*"]
ignore_missing_imports = true
